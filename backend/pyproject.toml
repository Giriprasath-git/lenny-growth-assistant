[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for The Lenny Growth Assistant conversational intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Oogway Labs Forward Deployed AI Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "anthropic>=0.36.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/backend", "tests/ingestion"]
python_files = ["test_*.py"]
