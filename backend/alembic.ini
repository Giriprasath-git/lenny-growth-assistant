# ==============================================================================
# Alembic Migration Configuration for The Lenny Growth Assistant
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with backend root
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Database URL fallback (overridden dynamically in env.py from settings.DATABASE_URL)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lenny_growth_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
