# ==============================================================================
# The Lenny Growth Assistant - Root Pytest Configuration
# Ensures consistent asyncio mode and fixture scoping regardless of working directory
# ==============================================================================

[pytest]
minversion = 8.0
testpaths = tests/backend tests/ingestion
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = . backend
addopts = -v
